<div class="dados-bancarios">
  <header class="dados-bancarios__header">
    <p class="dados-bancarios__eyebrow">{{ adesao.currentStepLabel() }}</p>
    <h1 class="dados-bancarios__title">Dados bancários</h1>
    <p class="dados-bancarios__subtitle">Informe a conta onde você quer receber seus valores. Você pode adicionar uma chave PIX para agilizar transferências futuras.</p>
  </header>

  <form class="dados-bancarios__form" (submit)="$event.preventDefault()">

    <div class="dados-bancarios__row">
      <div class="dados-bancarios__field">
        <leme-select label="FINALIDADE" [required]="true" placeholder="Selecione" [items]="finalidadeOptions" [(ngModel)]="finalidade" name="finalidade" />
      </div>
      <div class="dados-bancarios__field">
        <leme-select label="BANCO" [required]="true" placeholder="Selecione" [items]="bancoOptions" [(ngModel)]="banco" name="banco" />
      </div>
    </div>

    <div class="dados-bancarios__row">
      <div class="dados-bancarios__field">
        <leme-select label="TIPO DE CONTA" [required]="true" placeholder="Selecione" [items]="tipoContaOptions" [(ngModel)]="tipoConta" name="tipoConta" />
      </div>
      <div class="dados-bancarios__field">
        <leme-text-field label="AGÊNCIA" [required]="true" placeholder="0000" [(ngModel)]="agencia" name="agencia" />
      </div>
    </div>

    <div class="dados-bancarios__row">
      <div class="dados-bancarios__field">
        <leme-text-field label="NÚMERO DA CONTA" [required]="true" placeholder="00000-00" [(ngModel)]="numeroConta" name="numeroConta" />
      </div>
      <div class="dados-bancarios__field">
        <leme-text-field label="DÍGITO" [required]="true" placeholder="00" [(ngModel)]="digito" name="digito" />
      </div>
    </div>

    <leme-switch label="Aceita transferência via PIX:" [(ngModel)]="aceitaPix" name="aceitaPix" />

    @if (aceitaPix) {
      <div class="dados-bancarios__row">
        <div class="dados-bancarios__field">
          <leme-select
            label="TIPO DE CHAVE PIX"
            [required]="true"
            placeholder="Selecione"
            [items]="tipoChavePixOptions"
            [ngModel]="tipoChavePix"
            (ngModelChange)="onTipoChavePixChange($event)"
            name="tipoChavePix"
          />
        </div>
        <div class="dados-bancarios__field">
          <leme-text-field label="CHAVE PIX" [required]="true" placeholder="Chave PIX" [(ngModel)]="chavePix" name="chavePix" />
        </div>
      </div>
    }

    <leme-checkbox label="Tornar dado bancário principal" [(ngModel)]="principal" name="principal" />

    @if (dados.isMenorDeIdade()) {
      <leme-message
        severity="Informative"
        [showTitle]="false"
        message="Como o titular é menor de idade, a conta deve estar em nome do representante financeiro."
      />

      <div class="dados-bancarios__row">
        <div class="dados-bancarios__field">
          <leme-text-field label="NOME DO TITULAR DA CONTA" [required]="true" placeholder="Nome do representante financeiro" [(ngModel)]="titularNome" name="titularNome" />
        </div>
        <div class="dados-bancarios__field">
          <leme-text-field label="CPF DO TITULAR DA CONTA" [required]="true" mask="cpf" placeholder="000.000.000-00" [(ngModel)]="titularCpf" name="titularCpf" />
        </div>
      </div>

      @if (divergenciaTitularidade()) {
        <leme-message
          severity="Error"
          title="Divergência de titularidade"
          message="O CPF informado como titular da conta não corresponde ao CPF do representante financeiro cadastrado."
        />
      }
    }

  </form>
</div>
