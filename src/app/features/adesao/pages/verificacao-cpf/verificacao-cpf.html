<div class="verificacao-cpf">
  <header class="verificacao-cpf__header">
    <h1 class="verificacao-cpf__title">Vamos confirmar seu CPF</h1>
    <p class="verificacao-cpf__subtitle">
      Informe seu CPF para verificarmos se você já possui um cadastro ou uma adesão em andamento.
    </p>
  </header>

  <form class="verificacao-cpf__form" (submit)="$event.preventDefault()">
    <leme-text-field
      label="CPF"
      [required]="true"
      mask="cpf"
      placeholder="000.000.000-00"
      [ngModel]="cpf()"
      (ngModelChange)="onCpfChange($event)"
      name="cpf"
    />
  </form>

  <p class="verificacao-cpf__conta">
    Já possui uma conta?
    <button type="button" class="verificacao-cpf__conta-link" (click)="jaTemConta()">Clique aqui</button>
  </p>

  @if (semVinculoPatrocinadora()) {
    <leme-message
      severity="Error"
      title="CPF sem vínculo com a patrocinadora"
      message="Não foi possível confirmar seu vínculo com a patrocinadora do plano selecionado. Você pode voltar e escolher outro plano ou entrar em contato com a entidade."
    />
    <button type="button" class="verificacao-cpf__voltar" (click)="voltarParaSelecaoPlano()">Voltar à seleção de plano</button>
  }
</div>
